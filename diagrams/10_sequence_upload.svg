ily="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">DataNode</text><line x1="810" y1="50" x2="810" y2="552" stroke="#c3c2b7" stroke-width="1"/><polyline points="80,78 250,78" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="165.0" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0b0b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">POST /files/upload (multipart)</text><rect x="245" y="103" width="10" height="20" fill="#f0efec" stroke="#c3c2b7"/><text x="262" y="117" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">spool to disk, compute SHA-256</text><polyline points="250,152 420,152" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="335.0" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0b0b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">find active object by hash</text><polyline points="420,189 250,189" fill="none" stroke="#6f6d67" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="335.0" y="183" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">none found</text><polyline points="250,226 610,226" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="430.0" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0b0b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">PUT CREATE /staging/&lt;uuid&gt;</text><polyline points="610,263 250,263" fill="none" stroke="#6f6d67" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="430.0" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">307 redirect to a DataNode</text><polyline points="250,300 810,300" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="530.0" y="294" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0b0b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">PUT bytes</text><polyline points="810,337 250,337" fill="none" stroke="#6f6d67" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="530.0" y="331" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">201 after the write pipeline (3 replicas)</text><polyline points="250,374 810,374" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="530.0" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0b0b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">GET staged bytes, check SHA-256</text><polyline points="250,411 610,411" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="430.0" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0b0b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">PUT MKDIRS, then RENAME to /objects/ab/cd/&lt;sha&gt;</text><polyline points="610,448 250,448" fill="none" stroke="#6f6d67" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="430.0" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">true</text><polyline points="250,485 420,485" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="335.0" y="479" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0b0b0b" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">COMMIT file, object, audit, samples</text><polyline points="250,522 80,522" fill="none" stroke="#6f6d67" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="165.0" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">201 stored_new</text><text x="450" y="574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">For a duplicate, the lookup finds an object, HDFS confirms its length, and only the COMMIT step runs: no bytes are written.</text></svg>
