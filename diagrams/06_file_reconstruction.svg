<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f6d67"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6f6d67"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="40" width="170" height="70" rx="6" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.2"/><text x="115.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">GET /files/{id}/download</text><text x="115.0" y="87.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">Preflight: content exists</text><polyline points="200,75 235,75" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="235" y="40" width="170" height="70" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/><text x="320.0" y="65.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Load manifest</text><text x="320.0" y="82.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">file_chunks in</text><text x="320.0" y="96.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">ordinal order</text><polyline points="405,75 440,75" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="440" y="40" width="180" height="70" rx="6" fill="#e4effc" stroke="#2a78d6" stroke-width="1.2"/><text x="530.0" y="65.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">For each chunk</text><text x="530.0" y="82.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">OPEN via WebHDFS</text><text x="530.0" y="96.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">from a live replica</text><polyline points="620,75 655,75" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><polygon points="740,29.0 825.0,75 740,121.0 655.0,75" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.2"/><text x="740" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Chunk hash</text><text x="740" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">correct?</text><polyline points="740,121 740,175" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="750" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">no</text><rect x="640" y="175" width="200" height="62" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/><text x="740.0" y="203.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Abort the response</text><text x="740.0" y="220.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">Client sees a failed download</text><polyline points="740,29 740,20 530,20 530,40" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="635" y="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">yes: next chunk</text><polyline points="530,110 530,175" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="520" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">stream bytes, update hash</text><rect x="400" y="175" width="200" height="62" rx="6" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.2"/><text x="500.0" y="203.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Whole-file SHA-256</text><text x="500.0" y="220.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">computed while streaming</text><polyline points="400,206 330,206" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="120" y="175" width="210" height="62" rx="6" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.2"/><text x="225.0" y="197.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Compare with file hash</text><text x="225.0" y="214.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#52514e">Mismatch aborts; match records</text><text x="225.0" y="227.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#52514e">a restore sample and audit event</text><text x="450" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#52514e">Whole-file and raw modes stream one HDFS file through the same final comparison.</text><text x="450" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#52514e">An HDFS outage is reported as an error, never as a failed integrity check.</text></svg>
