-weight="normal" text-anchor="middle" fill="#52514e">Writes follow a fixed order:</text><text x="775" y="387" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">bytes to D2, then metadata to D1</text><text x="775" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">P6 records provenance, then</text><text x="775" y="427" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">stores files through P1</text></svg>
