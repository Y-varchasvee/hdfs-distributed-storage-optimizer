/><text x="755.0" y="338.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">/chunks/ab/cd/&lt;sha of c5&gt;</text><text x="755.0" y="352.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#52514e">1 HDFS file, replicated separately</text><text x="370" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#52514e">Two identical files share one manifest. A file with</text><text x="370" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#52514e">one changed chunk adds one new chunk (c5).</text><text x="370" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Chunks are application-level files, not HDFS blocks.</text></svg>
