<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f6d67"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6f6d67"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="30" width="185" height="76" rx="6" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.2"/><text x="122.5" y="58.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Receive</text><text x="122.5" y="75.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">multipart upload</text><text x="122.5" y="89.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">validate name, folder</text><polyline points="215,68 245,68" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="245" y="30" width="185" height="76" rx="6" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.2"/><text x="337.5" y="58.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Spool + hash</text><text x="337.5" y="75.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">streamed to disk</text><text x="337.5" y="89.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">SHA-256, size</text><polyline points="430,68 460,68" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="460" y="30" width="185" height="76" rx="6" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.2"/><text x="552.5" y="58.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Look up</text><text x="552.5" y="75.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">objects, manifests</text><text x="552.5" y="89.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">by content hash</text><polyline points="645,68 675,68" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><polygon points="770,22.0 865.0,68 770,114.0 675.0,68" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.2"/><text x="770" y="65" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">Content</text><text x="770" y="79" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">already stored?</text><polyline points="865,68 865,180" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="855" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">yes</text><rect x="660" y="180" width="220" height="76" rx="6" fill="#e3f5ec" stroke="#1baf7a" stroke-width="1.2"/><text x="770.0" y="208.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Reference only</text><text x="770.0" y="225.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">Check it exists in HDFS</text><text x="770.0" y="239.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">Repair from upload if missing</text><polyline points="770,114 770,150 130,150 130,180" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><text x="450" y="143" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#52514e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">no: write new bytes</text><rect x="30" y="180" width="165" height="76" rx="6" fill="#e4effc" stroke="#2a78d6" stroke-width="1.2"/><text x="112.5" y="208.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">1. Stage</text><text x="112.5" y="225.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">CREATE</text><text x="112.5" y="239.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">/staging/&lt;uuid&gt;</text><polyline points="195,218 220,218" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="220" y="180" width="165" height="76" rx="6" fill="#e4effc" stroke="#2a78d6" stroke-width="1.2"/><text x="302.5" y="208.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">2. Check</text><text x="302.5" y="225.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">length and</text><text x="302.5" y="239.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">SHA-256 read-back</text><polyline points="385,218 410,218" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="410" y="180" width="165" height="76" rx="6" fill="#e4effc" stroke="#2a78d6" stroke-width="1.2"/><text x="492.5" y="208.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">3. Publish</text><text x="492.5" y="225.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">atomic RENAME to</text><text x="492.5" y="239.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">/objects/ab/cd/&lt;sha&gt;</text><polyline points="492,256 492,320 360,320" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><polyline points="770,256 770,346 560,346" fill="none" stroke="#6f6d67" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="160" y="300" width="400" height="76" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/><text x="360.0" y="328.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">4. Commit metadata in one SQLite transaction</text><text x="360.0" y="345.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">LogicalFile row, object or manifest pointer</text><text x="360.0" y="359.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#52514e">Audit event, performance samples, storage snapshot</text><text x="450" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#52514e">Crash before step 4: only an unreferenced HDFS file remains, which reconciliation can find. Metadata never points at missing bytes.</text></svg>
